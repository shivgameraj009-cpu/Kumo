<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6C3BAA">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Kumo Watch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Noto+Sans:wght@400;600&display=swap">
<style>
/* Layout: phone-first app shell. Sticky header, hero banner, snap-scrolling poster rows, poster grids, bottom tab bar, bottom sheet for details. Every title carries a Hindi-dub badge. */
:root{
  --bg:#F8F5FC;
  --surface:#FFFFFF;
  --surface2:#EEE8F6;
  --fg:#1F1830;
  --muted:#675C7C;
  --line:#DDD3EC;
  --accent:#6C3BAA;
  --accent-fg:#FFFFFF;
  --font-display:"Bricolage Grotesque","Noto Sans",system-ui,sans-serif;
  --font-body:"Noto Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#110D1B;--surface:#1B1528;--surface2:#261E38;--fg:#F1ECFA;--muted:#A99FC0;--line:#342A4D;--accent:#B99BFF;--accent-fg:#1C0B33;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#110D1B;--surface:#1B1528;--surface2:#261E38;--fg:#F1ECFA;--muted:#A99FC0;--line:#342A4D;--accent:#B99BFF;--accent-fg:#1C0B33;color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(96px + env(safe-area-inset-bottom,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1100px;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:12px}
.logo{font-family:var(--font-display);font-weight:800;font-size:24px;letter-spacing:-.02em;margin-right:auto;display:flex;align-items:center;gap:8px}
.logo img{display:block;width:40px;height:40px;border-radius:10px}
.iconbtn{display:inline-flex;align-items:center;gap:6px;height:40px;min-width:40px;justify-content:center;border-radius:20px;background:var(--surface2);padding:0 10px;font-weight:600;font-size:13px}

/* hero */
.hero{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:16/11;min-height:250px;max-height:440px;background:var(--surface2)}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .5s;pointer-events:none;color:#fff;background:linear-gradient(150deg,hsl(var(--h1) 58% 40%),hsl(var(--h2) 62% 14%))}
.slide.on{opacity:1;pointer-events:auto}
.slide::before{content:"";position:absolute;width:70%;aspect-ratio:1;border-radius:50%;right:-12%;top:-30%;background:radial-gradient(circle at 35% 35%,hsl(var(--h1) 80% 70% / .5),transparent 65%)}
.slide::after{content:"";position:absolute;inset:auto 0 0 0;height:70%;background:linear-gradient(transparent,rgba(8,4,14,.72))}
.sc{position:absolute;z-index:1;left:20px;right:20px;bottom:36px;display:flex;flex-direction:column;gap:8px;max-width:560px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.18)}
.tag.dub{background:var(--accent);color:var(--accent-fg)}
.slide h2{font-family:var(--font-display);font-weight:800;font-size:clamp(26px,6vw,42px);line-height:1.08;letter-spacing:-.02em;text-wrap:balance}
.slide .meta{font-size:13px;opacity:.92}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:21px;font-weight:700;font-size:14px;text-decoration:none;border:1.5px solid transparent}
.btn.pri{background:var(--accent);color:var(--accent-fg)}
.btn.sec{background:rgba(255,255,255,.18);color:#fff}
.btn.ghost{border-color:var(--line);color:var(--fg)}
.btn.soft{background:var(--surface2);color:var(--fg)}
.dots{position:absolute;z-index:2;right:16px;bottom:14px;display:flex;gap:6px}
.dots button{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.4);transition:width .25s}
.dots button.on{width:22px;background:#fff}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 16px;border-radius:18px;background:var(--surface2);font-weight:600;font-size:14px}
.chip.on{background:var(--accent);color:var(--accent-fg)}

/* sections, rows, grids */
.sec-h{font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:-.01em;margin:24px 0 12px}
.row{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.row .card{flex:none;width:132px;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:18px 12px;margin-top:16px}
.card{position:relative;min-width:0}
.open{display:block;width:100%;text-align:left;border-radius:12px}
.cmeta{display:flex;align-items:flex-start;gap:6px;margin-top:8px}
.cmeta>div{min-width:0;flex:1}
.ct{font-size:13.5px;font-weight:600;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cm{font-size:12px;color:var(--muted)}
.save{flex:none;width:30px;height:30px;border-radius:50%;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center}
.save .ic{width:16px;height:16px}
.save[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}

/* generated poster art */
.poster{position:relative;aspect-ratio:2/3;border-radius:12px;overflow:hidden;color:#fff;container-type:inline-size;background:linear-gradient(165deg,hsl(var(--h1) 58% 40%),hsl(var(--h2) 62% 14%))}
.poster::before{content:"";position:absolute;width:95%;aspect-ratio:1;border-radius:50%;right:-28%;top:-10%;background:radial-gradient(circle at 35% 35%,hsl(var(--h1) 80% 70% / .55),transparent 65%)}
.poster::after{content:"";position:absolute;inset:auto 0 0 0;height:60%;background:linear-gradient(transparent,rgba(0,0,0,.62))}
.pb{position:absolute;z-index:1;top:8cqw;left:8cqw;font-size:7.5cqw;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2cqw 4cqw;border-radius:2cqw;background:var(--accent);color:var(--accent-fg)}
.pa{position:absolute;z-index:1;top:8cqw;right:8cqw;font-size:7.5cqw;font-weight:800;padding:2cqw 4cqw;border-radius:2cqw;background:rgba(10,6,16,.72);color:#fff;border:.4cqw solid rgba(255,255,255,.55)}
.pa.a18{background:#B3261E;border-color:#fff}
.pt{position:absolute;z-index:1;left:8cqw;right:8cqw;bottom:8cqw;font-family:var(--font-display);font-weight:800;font-size:13cqw;line-height:1.1;letter-spacing:-.01em;text-wrap:balance;text-shadow:0 1px 6px rgba(0,0,0,.45)}

/* states */
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;color:var(--muted);padding:64px 16px}
.empty .ic{width:40px;height:40px}
.sbox{display:flex;align-items:center;gap:10px;height:48px;border-radius:24px;background:var(--surface2);padding:0 16px;margin-top:4px}
.sbox input{flex:1;min-width:0;border:0;background:none;color:var(--fg);font:inherit;font-size:16px;outline:0}
.sbox:focus-within{outline:2px solid var(--accent)}

/* bottom tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{display:grid;grid-template-columns:repeat(4,1fr);max-width:560px;margin:0 auto}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--muted);min-width:0}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab[aria-current="page"]{color:var(--accent)}

/* detail sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,6,16,.62);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--surface);color:var(--fg);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.panel-h{display:flex;align-items:center;justify-content:flex-end;margin-bottom:8px}
.xbtn{width:36px;height:36px;border-radius:50%;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;flex:none}
.d-top{display:flex;gap:16px;align-items:flex-start}
.d-top .poster{width:112px;flex:none}
.d-info{min-width:0;display:flex;flex-direction:column;gap:6px}
.d-info h2{font-family:var(--font-display);font-weight:800;font-size:22px;line-height:1.15;letter-spacing:-.01em}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:12px;background:var(--surface2)}
.pill.age{border:1.5px solid var(--muted)}
.agebar{display:flex;align-items:center;gap:8px;overflow-x:auto;padding-block:4px 0;scrollbar-width:none}
.agebar::-webkit-scrollbar{display:none}
.agebar b{flex:none;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip.sm{height:30px;padding:0 12px;font-size:13px}
.pill.dub{background:var(--accent);color:var(--accent-fg)}
.d-syn{margin-top:16px;max-width:65ch}
.d-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.d-h{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
.dubs{display:grid;gap:8px}
.dubrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-radius:12px;background:var(--surface2);text-decoration:none}
.dubrow div{min-width:0}
.dubrow strong{display:block;font-size:14px}
.dubrow span{font-size:13px;color:var(--muted)}
.dubrow .ic{width:18px;height:18px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin-top:12px;max-width:65ch}

@media (min-width:700px){
  .row .card{width:160px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .sc{left:36px;bottom:44px}
  .scrim{align-items:center}
  .panel{border-radius:20px;max-height:84%}
}
@media (prefers-reduced-motion:reduce){.slide,.dots button{transition:none}}
</style>

</head>

  HI.forEach(function(id,i){
    var it=BY[id];
    h+='<div class="slide'+(i===0?' on':'')+'" data-slide="'+i+'" style="--h1:'+it.h[0]+';--h2:'+it.h[1]+'">'+
    '<div class="sc"><div class="tags"><span class="tag dub">Hindi dub</span><span class="tag">'+it.kind+'</span><span class="tag">'+it.age+'+</span></div>'+
    '<h2>'+esc(it.t)+'</h2><p class="meta">'+it.y+' · '+esc(genreText(it))+' · '+esc(platText(it))+'</p>'+
    '<div class="acts"><a class="btn pri" href="'+trailerUrl(it)+'" target="_blank" rel="noopener noreferrer">'+ic('play')+'Watch trailer</a>'+
    '<button class="btn sec" type="button" data-open="'+id+'">Details</button></div></div></div>';
  });
  h+='<div class="dots">';
  HI.forEach(function(id,i){h+='<button type="button" data-dot="'+i+'" class="'+(i===0?'on':'')+'" aria-label="Slide '+(i+1)+'"></button>';});
  return h+'</div></section>';
}

function matches(it){
  var c=state.chip;
  if(c==="all")return true;
  if(c.indexOf("g:")===0)return it.g.indexOf(c.slice(2))>-1;
  if(c.indexOf("p:")===0)return it.dub.some(function(d){return d[0]===c.slice(2);});
  if(c==="f:film")return !!it.film;
  if(c==="f:free")return isFree(it);
  return true;
}
function filtered(kind){return VIS().filter(function(i){return (!kind||i.kind===kind)&&matches(i);});}
function gridOf(list){
  return list.length?'<div class="grid">'+list.map(card).join("")+'</div>':'<div class="empty"><p>No titles match.</p></div>';
}
function rowOf(title,list){return '<h2 class="sec-h">'+title+'</h2><div class="row">'+list.map(card).join("")+'</div>';}
function byPlat(p){return VIS().filter(function(i){return i.dub.some(function(d){return d[0]===p;});});}
function pick(f,n){return VIS().filter(f).slice(0,n||16);}
function hasG(i,gs){return gs.some(function(g){return i.g.indexOf(g)>-1;});}

/* ---------- views ---------- */
var timer=null;
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
function startTimer(){
  stopTimer();
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  timer=setInterval(function(){
    var on=document.querySelector(".slide.on");if(!on)return;
    go((+on.getAttribute("data-slide")+1)%document.querySelectorAll(".slide").length);
  },6500);
}
function go(i){
  document.querySelectorAll(".slide").forEach(function(s){s.classList.toggle("on",+s.getAttribute("data-slide")===i);});
  document.querySelectorAll("[data-dot]").forEach(function(d){d.classList.toggle("on",+d.getAttribute("data-dot")===i);});
}
function render(){
  stopTimer();
  var app=document.getElementById("app"),v=state.view,h="";
  if(v==="home"){
    h=hero()+chips();
    if(state.chip==="all"){
      h+=rowOf("Free to watch",VIS().filter(isFree))+
         rowOf("K-Dramas in Hindi",pick(function(i){return i.kind==="K-Drama";}))+
         rowOf("Action and adventure anime",pick(function(i){return i.kind==="Anime"&&!i.film&&hasG(i,["action","adventure"]);}))+
         rowOf("Romance and comedy anime",pick(function(i){return i.kind==="Anime"&&hasG(i,["romance","comedy"]);}))+
         rowOf("Fantasy worlds",pick(function(i){return i.kind==="Anime"&&!i.film&&hasG(i,["fantasy"]);}))+
         rowOf("Anime films",pick(function(i){return !!i.film||i.id==="yourname"||i.id==="spirited";}))+
         rowOf("On Netflix",byPlat("Netflix").slice(0,16))+
         rowOf("On Crunchyroll",byPlat("Crunchyroll").slice(0,16))+
         rowOf("On Amazon MX Player",byPlat("Amazon MX Player").slice(0,16));
    }else h+=gridOf(filtered());
  }else if(v==="kdrama"){
    h=chips()+gridOf(filtered("K-Drama"));
  }else if(v==="anime"){
    h=chips()+gridOf(filtered("Anime"));
  }else if(v==="mylist"){
    var l=state.saved.map(function(id){return BY[id];}).filter(function(i){return i.age<=state.age;});
    h=l.length?gridOf(l):'<div class="empty">'+ic('mylist')+'<p>Nothing saved yet. Tap the + on any title.</p></div>';
  }else if(v==="search"){
    h='<label class="sbox">'+ic('search')+'<input id="q" type="search" autocomplete="off" placeholder="Search titles" value="'+esc(state.q)+'"></label><div id="results"></div>';
  }
  app.innerHTML=h;
  if(v==="search")results();
  if(v==="home")startTimer();
  chrome();
}
function results(){
  var q=state.q.trim().toLowerCase(),box=document.getElementById("results");if(!box)return;
  var list=q?VIS().filter(function(i){return i.t.toLowerCase().indexOf(q)>-1;}):VIS();
  box.innerHTML=gridOf(list);
}
function chrome(){
  var tabs=[["home","Home"],["kdrama","K-Drama"],["anime","Anime"],["mylist","My List"]];
  document.getElementById("tabs").innerHTML=tabs.map(function(x){
    return '<button class="tab" type="button" data-tab="'+x[0]+'"'+(state.view===x[0]?' aria-current="page"':'')+'>'+ic(x[0])+'<span>'+x[1]+'</span></button>';
  }).join("");
  document.getElementById("btn-search").innerHTML=ic('search');
}

/* ---------- detail sheet ---------- */
var lastFocus=null;
function openSheet(html){
  lastFocus=document.activeElement;
  document.getElementById("panel").innerHTML=html;
  document.getElementById("scrim").hidden=false;
  document.body.style.overflow="hidden";
  var x=document.querySelector("#panel [data-close]");if(x)x.focus();
}
function closeSheet(){
  document.getElementById("scrim").hidden=true;
  document.body.style.overflow="";
  if(lastFocus&&lastFocus.focus)try{lastFocus.focus();}catch(e){}
}
function detail(id){
  var it=BY[id],q=encodeURIComponent(it.t),s=isSaved(id);
  var pills='<span class="pill dub">Hindi dub</span><span class="pill age">Age '+it.age+'+</span>'+(isFree(it)?'<span class="pill">Free option</span>':'')+it.g.map(function(g){return '<span class="pill">'+GENRE[g]+'</span>';}).join("")+'<span class="pill">'+it.kind+'</span>';
  var dubs=it.dub.map(function(d){
    var link=LINKS[d[0]];
    var inner='<div><strong>'+esc(d[0])+'</strong><span>'+esc(d[1])+'</span></div>';
    return link?'<a class="dubrow" href="'+link+q+'" target="_blank" rel="noopener noreferrer">'+inner+ic('ext')+'</a>':'<div class="dubrow">'+inner+'</div>';
  }).join("");
  openSheet(
    '<div class="panel-h"><button class="xbtn" type="button" data-close aria-label="Close">'+ic('x')+'</button></div>'+
    '<div class="d-top">'+poster(it)+'<div class="d-info"><h2>'+esc(it.t)+'</h2><p class="cm">'+it.y+'</p><div class="pills">'+pills+'</div></div></div>'+
    '<p class="d-syn">'+esc(it.s)+'</p>'+
    '<div class="d-acts"><a class="btn pri" href="'+trailerUrl(it)+'" target="_blank" rel="noopener noreferrer">'+ic('play')+'Watch trailer</a>'+
    '<button class="btn soft" type="button" data-save="'+id+'" data-wide="1" aria-pressed="'+s+'">'+ic(s?'check':'plus')+'<span>'+(s?'In My List':'Add to My List')+'</span></button></div>'+
    '<h3 class="d-h">Hindi dub available on</h3><div class="dubs">'+dubs+'</div>'+
    '<p class="note">Age guide: an estimate by Kumo based on content, not an official rating. Check the rating on the platform before children watch. Dub availability changes by platform and region. This was checked against public listings in November 2026. Confirm Hindi in the audio menu before you watch. Playback happens on the official service.</p>'
  );
}

/* ---------- saving ---------- */
function toggleSave(id){
  var i=state.saved.indexOf(id);
  if(i>-1)state.saved.splice(i,1);else state.saved.push(id);
  lsSet("kumo.list",JSON.stringify(state.saved));
  var s=isSaved(id);
  document.querySelectorAll('[data-save="'+id+'"]').forEach(function(b){
    b.setAttribute("aria-pressed",String(s));
    if(b.getAttribute("data-wide")){b.innerHTML=ic(s?'check':'plus')+'<span>'+(s?'In My List':'Add to My List')+'</span>';}
    else{b.innerHTML=ic(s?'check':'plus');b.setAttribute("aria-label",s?'In My List':'Add to My List');}
  });
  if(state.view==="mylist"&&document.getElementById("scrim").hidden)render();
}

/* ---------- routing ---------- */
var VIEWS=["home","kdrama","anime","mylist","search"];
function fromHash(){
  var h=(location.hash||"").replace("#","");
  var v=VIEWS.indexOf(h)>-1?h:"home";
  if(v!==state.view){state.view=v;state.chip="all";}
  render();window.scrollTo(0,0);
}
function nav(v){
  if(location.hash==="#"+v){fromHash();}else{location.hash=v;}
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-open],[data-save],[data-tab],[data-chip],[data-age],[data-close],[data-dot],#btn-search,#scrim");
  if(!el)return;
  if(el.id==="scrim"){if(e.target===el)closeSheet();return;}
  if(el.hasAttribute("data-close")){closeSheet();return;}
  if(el.hasAttribute("data-save")){toggleSave(el.getAttribute("data-save"));return;}
  if(el.hasAttribute("data-open")){detail(el.getAttribute("data-open"));return;}
  if(el.hasAttribute("data-tab")){nav(el.getAttribute("data-tab"));return;}
  if(el.hasAttribute("data-chip")){state.chip=el.getAttribute("data-chip");render();return;}
  if(el.hasAttribute("data-age")){state.age=+el.getAttribute("data-age");lsSet("kumo.age",String(state.age));render();return;}
  if(el.hasAttribute("data-dot")){go(+el.getAttribute("data-dot"));startTimer();return;}
  if(el.id==="btn-search"){nav("search");return;}
});
document.addEventListener("input",function(e){
  if(e.target&&e.target.id==="q"){state.q=e.target.value;results();}
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&!document.getElementById("scrim").hidden)closeSheet();
});
window.addEventListener("hashchange",fromHash);
fromHash();
})();
</script>
